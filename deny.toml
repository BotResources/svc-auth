[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
ignore = [
    "RUSTSEC-2023-0071",
    # Why: unmaintained-only advisory (no vulnerability) on chrono, which
    # svc-auth uses directly and which br-rust-common (br-core-events,
    # br-core-integration, br-util-observability) pulls in (`cargo tree -i
    # chrono -e normal`, checked 2026-11-18).
    # No upstream fix exists as of 2026-11-18: the advisory covers every
    # version, the locked 0.4.45 included. Waived by ID, never by crate, so
    # chrono's next advisory, a vulnerability included, still fails this
    # check.
    # Not mirrored in ci.yml's `cargo audit`: it only warns on an
    # unmaintained crate, so it passes and keeps showing this one.
    # Remove once chrono leaves this build graph, with the move to jiff
    # tracked across every Rust repo in the epic
    # https://github.com/BotResources/botresources.ai-claude-workspace/issues/341
    # Review by 2027-02-17.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, every version affected, no fixed release; move to jiff; review by 2027-02-17" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "Unlicense",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = [
    "https://github.com/BotResources/br-rust-common",
    "https://github.com/BotResources/br-e2e-harness",
]
