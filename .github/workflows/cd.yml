name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  IMAGE: ghcr.io/botresources/br-svc-auth

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # GitHub-hosted (free for public repos — self-hosted ARC runners refuse
    # public repos by design), but inside the org runner image so the job
    # gets the same baked toolchain as arc-ubuntu, Zig included.
    container:
      image: ghcr.io/botresources/br-arc-runner:stable
      # root: the image's `runner` user is in docker gid 123, the hosted VM's
      # /var/run/docker.sock is gid 118 — as `runner`, every docker call is
      # "permission denied". The VM is discarded after the job, so running
      # the throwaway container as root costs nothing.
      options: --user root
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: resolve version + gate
        id: ver
        run: |
          version="$(grep -E '^version\s*=' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if git tag -l "$tag" | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $tag already exists — nothing to publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: verify changelog entry
        if: steps.ver.outputs.skip == 'false'
        run: |
          version="${{ steps.ver.outputs.version }}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md missing"
            exit 1
          fi
          if ! grep -qE "^## ${version}( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' heading"
            exit 1
          fi

      - name: registry gate (pre-build)
        if: steps.ver.outputs.skip == 'false'
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: scripts/registry-gate.sh svc-auth "${{ steps.ver.outputs.version }}" "${IMAGE}"

      - name: setup rust targets
        if: steps.ver.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      # Zig (cargo-zigbuild's linker) is baked into br-arc-runner rather than
      # fetched by mlugg/setup-zig: that action's community-mirror download has
      # no timeout and once held a publish job for 2h. See
      # BotResources/infra.botresources.ai#241.
      - name: install cargo-zigbuild
        if: steps.ver.outputs.skip == 'false'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: cargo cache
        if: steps.ver.outputs.skip == 'false'
        uses: Swatinem/rust-cache@v2

      - name: setup buildx
        if: steps.ver.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: login to GHCR
        if: steps.ver.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo zigbuild (x86_64-musl)
        if: steps.ver.outputs.skip == 'false'
        run: cargo zigbuild --release --locked --target x86_64-unknown-linux-musl

      - name: cargo zigbuild (aarch64-musl)
        if: steps.ver.outputs.skip == 'false'
        run: cargo zigbuild --release --locked --target aarch64-unknown-linux-musl

      - name: assert static (no PT_INTERP)
        if: steps.ver.outputs.skip == 'false'
        run: |
          set -euo pipefail
          for triple in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            path="target/${triple}/release/svc-auth"
            if readelf -l "$path" | grep -q "INTERP"; then
              echo "::error::$path has a PT_INTERP segment — it is NOT static"
              readelf -l "$path" | grep -A2 "INTERP"
              exit 1
            fi
            echo "ok: $path is static"
          done

      - name: registry gate (pre-push re-check)
        if: steps.ver.outputs.skip == 'false'
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: scripts/registry-gate.sh svc-auth "${{ steps.ver.outputs.version }}" "${IMAGE}"

      - name: registry docs (pose procedural SDL + DB schema)
        if: steps.ver.outputs.skip == 'false'
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: scripts/registry-docs.sh svc-auth "${{ steps.ver.outputs.version }}"

      - name: docker build + push (amd64)
        if: steps.ver.outputs.skip == 'false'
        run: |
          docker build --provenance=false --platform linux/amd64 \
            --build-arg BIN_PATH=target/x86_64-unknown-linux-musl/release/svc-auth \
            --tag "${IMAGE}:${{ steps.ver.outputs.version }}-amd64" .
          docker push "${IMAGE}:${{ steps.ver.outputs.version }}-amd64"

      - name: docker build + push (arm64)
        if: steps.ver.outputs.skip == 'false'
        run: |
          docker build --provenance=false --platform linux/arm64 \
            --build-arg BIN_PATH=target/aarch64-unknown-linux-musl/release/svc-auth \
            --tag "${IMAGE}:${{ steps.ver.outputs.version }}-arm64" .
          docker push "${IMAGE}:${{ steps.ver.outputs.version }}-arm64"

      - name: create + push multi-arch manifest
        if: steps.ver.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          for tag in "$VERSION" latest stable; do
            docker manifest create --amend "${IMAGE}:${tag}" \
              "${IMAGE}:${VERSION}-amd64" \
              "${IMAGE}:${VERSION}-arm64"
            docker manifest push "${IMAGE}:${tag}"
          done

      - name: publish helm chart
        if: steps.ver.outputs.skip == 'false'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          CHART_REPO="oci://ghcr.io/botresources/charts"

          echo "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

          CHART_OUT="$(mktemp -d)"
          helm package charts/br-svc-auth \
            --version "$VERSION" --app-version "$VERSION" \
            --destination "$CHART_OUT"

          helm push "$CHART_OUT/br-svc-auth-${VERSION}.tgz" "$CHART_REPO"

      - name: create git tag
        if: steps.ver.outputs.skip == 'false'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "::notice::Created tag $TAG"

  registry-implement:
    name: registry implement
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.skip == 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: record image + observe implemented flip
        env:
          BR_REGISTRY_KEY: ${{ secrets.BR_REGISTRY_KEY }}
        run: scripts/registry-implement.sh svc-auth "${{ needs.publish.outputs.version }}" "${IMAGE}:${{ needs.publish.outputs.version }}"
