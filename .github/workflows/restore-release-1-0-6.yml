# ONE-OFF. Restores the 1.0.6 image and chart tags to the artifacts released on 2026-10-11,
# after CD run 40344520419 re-published 1.0.6 by mistake (see #44). DELETE THIS FILE AFTER USE.
#
# Uses only the repo's own GITHUB_TOKEN (packages: write): no personal token is involved.
# Run it twice, from main:
#   1. apply=false (the default): read-only. Verifies the originals and prints current -> target.
#   2. apply=true: writes exactly six tags (children first), then re-reads every tag and
#      fails the run on any mismatch. Nothing is ever deleted.
# Every original manifest is hashed against its digest before any write; any surprise aborts.
name: restore-release-1-0-6

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "restore-1.0.6" to run'
        required: true
      apply:
        description: "Write the tags (false = read-only dry run)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: restore-release-1-0-6
  cancel-in-progress: false

jobs:
  restore:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'restore-1.0.6'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPLY: ${{ inputs.apply }}
      GH_ACTOR: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: restore the svc-auth 1.0.6 tags
        shell: python
        run: |
          import base64, hashlib, json, os, sys, urllib.error, urllib.request

          APPLY = os.environ.get("APPLY", "false").lower() == "true"
          USER = os.environ["GH_ACTOR"]
          TOKEN = os.environ["REGISTRY_TOKEN"]
          ACCEPT = ",".join([
              "application/vnd.oci.image.index.v1+json", "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.oci.image.manifest.v1+json", "application/vnd.docker.distribution.manifest.v2+json"])

          IMG, CHART = "botresources/br-svc-auth", "botresources/charts/br-svc-auth"
          INDEX = "sha256:461afb1c41c137774efdce359fca1a2d9b767794b98dcde2f4d0bee5374d0489"
          AMD64 = "sha256:f9b116b0bedf1f5843216b0efea57ae2206becd6b522b48c3da770aee37eb699"
          ARM64 = "sha256:78cdcd5fb8cfe94d2461b7fc89a4b9282b39b6ca07ee2703f52b8aed753a84c7"
          CHARTD = "sha256:17481a3a271535be2ae8066a007d2cb5f97d79e6f2a4171f974dc1a361fbc5a6"
          # Children first, so the index never points at a manifest that is not tagged/reachable.
          PLAN = [(IMG, "1.0.6-amd64", AMD64), (IMG, "1.0.6-arm64", ARM64),
                  (IMG, "1.0.6", INDEX), (IMG, "stable", INDEX), (IMG, "latest", INDEX),
                  (CHART, "1.0.6", CHARTD)]


          def reg_token(repo, actions):
              req = urllib.request.Request(f"https://ghcr.io/token?service=ghcr.io&scope=repository:{repo}:{actions}")
              req.add_header("Authorization", "Basic " + base64.b64encode(f"{USER}:{TOKEN}".encode()).decode())
              with urllib.request.urlopen(req, timeout=40) as r:
                  return json.load(r)["token"]


          def call(method, url, tok, headers=None, body=None):
              req = urllib.request.Request(url, data=body, method=method)
              req.add_header("Authorization", f"Bearer {tok}")
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, {k.lower(): v for k, v in r.headers.items()}, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, {k.lower(): v for k, v in e.headers.items()}, e.read()


          def current(repo, tag, tok):
              st, h, _ = call("HEAD", f"https://ghcr.io/v2/{repo}/manifests/{tag}", tok, {"Accept": ACCEPT})
              return h.get("docker-content-digest") if st == 200 else f"<HTTP {st}>"


          def die(msg):
              print(f"::error::{msg}")
              sys.exit(1)


          print(f"mode: {'APPLY (writes 6 tags)' if APPLY else 'DRY RUN (read-only)'}; nothing is deleted\n")
          pull = {r: reg_token(r, "pull") for r in (IMG, CHART)}

          # 1. every original must be reachable and its body must hash to its own digest
          originals = {}
          for repo, _tag, digest in PLAN:
              if digest in originals:
                  continue
              st, h, body = call("GET", f"https://ghcr.io/v2/{repo}/manifests/{digest}", pull[repo], {"Accept": ACCEPT})
              if st != 200 or "sha256:" + hashlib.sha256(body).hexdigest() != digest:
                  die(f"original {digest} is missing or does not match its digest (HTTP {st})")
              originals[digest] = (h["content-type"], body)
              print(f"original {digest[:19]}…  {len(body)} bytes  {h['content-type']}  hash OK")

          # 2. the original index must be exactly the two per-arch images we are about to tag
          kids = {m["digest"] for m in json.loads(originals[INDEX][1])["manifests"]}
          if kids != {AMD64, ARM64}:
              die(f"original index children {sorted(kids)} are not the expected amd64/arm64 pair")
          print("original index children == {amd64, arm64}: OK\n")

          before = {(r, t): current(r, t, pull[r]) for r, t, _ in PLAN}
          for repo, tag, digest in PLAN:
              state = "already correct" if before[(repo, tag)] == digest else "WILL CHANGE"
              print(f"{repo.split('/', 1)[1]:<20} :{tag:<12} {before[(repo, tag)]}\n{'':>34}-> {digest}  ({state})")

          after = dict(before)
          if APPLY:
              push = {r: reg_token(r, "pull,push") for r in (IMG, CHART)}
              print()
              for repo, tag, digest in PLAN:
                  ctype, body = originals[digest]
                  st, h, resp = call("PUT", f"https://ghcr.io/v2/{repo}/manifests/{tag}", push[repo], {"Content-Type": ctype}, body)
                  got = h.get("docker-content-digest")
                  print(f"PUT {repo.split('/', 1)[1]:<20} :{tag:<12} HTTP {st}  {got}")
                  if st not in (200, 201) or got != digest:
                      die(f"write of {repo}:{tag} failed (HTTP {st}); stopping, later tags were not written")
              after = {(r, t): current(r, t, pull[r]) for r, t, _ in PLAN}

          bad = [(r, t) for r, t, d in PLAN if APPLY and after[(r, t)] != d]
          rows = ["| tag | before | target | after |", "|---|---|---|---|"]
          for repo, tag, digest in PLAN:
              rows.append(f"| `{repo.split('/', 1)[1]}:{tag}` | `{before[(repo, tag)][:19]}…` | `{digest[:19]}…` | "
                          f"`{after[(repo, tag)][:19]}…` {'OK' if APPLY and after[(repo, tag)] == digest else ('dry run' if not APPLY else 'MISMATCH')} |")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as f:
                  f.write(("## svc-auth 1.0.6 restore (APPLIED)\n\n" if APPLY else "## svc-auth 1.0.6 restore (dry run, nothing written)\n\n") + "\n".join(rows) + "\n")
          if bad:
              die(f"tags that do not match their original after the write: {bad}")
          print("\nverified: every tag matches its original digest" if APPLY else "\ndry run complete; nothing written")
